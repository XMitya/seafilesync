name: Release

# Pushing a tag such as v1.2.3 builds a signed APK, for installing directly, and a signed app
# bundle (AAB), for uploading to Google Play, and publishes both as a GitHub release along with
# the native debug symbols. Play reads the symbols from the bundle itself; the separate zip is for
# uploading to a version whose bundle went up without them.
# Running the workflow by hand builds the same files for a given version, as an artifact only,
# without creating a release -- for checking the pipeline or a candidate build.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, without the leading v (nothing is released)
        required: true
        default: 0.0.0

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Work out the version
        id: version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$DISPATCH_VERSION"
          fi
          if ! [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Version must look like 1.2.3, got '$version'"
            exit 1
          fi
          major=${BASH_REMATCH[1]}; minor=${BASH_REMATCH[2]}; patch=${BASH_REMATCH[3]}
          if [ "$minor" -ge 100 ] || [ "$patch" -ge 100 ]; then
            echo "::error::Minor and patch must stay below 100 so the version code stays ordered"
            exit 1
          fi
          # 1.2.3 -> 10203: a version code that orders the same way the version does.
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_OUTPUT"

      - name: Restore the signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::The SIGNING_KEYSTORE_BASE64 secret is not set; see README, Releasing"
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Install the NDK
        # The build strips the native libraries and extracts their debug symbols with the NDK, but
        # AGP only downloads one for a C++ build; without it the build quietly does neither. The
        # runner image carries a few NDK versions that change over time, so install the pinned one
        # unless it is already there.
        run: |
          ndk=$(sed -n 's/^ndk = "\(.*\)"$/\1/p' gradle/libs.versions.toml)
          if [ -z "$ndk" ]; then
            echo "::error::No ndk version in gradle/libs.versions.toml"
            exit 1
          fi
          if [ ! -d "$ANDROID_HOME/ndk/$ndk" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk"
          fi
      - name: Run unit tests and build the signed release APK and app bundle
        env:
          SIGNING_KEYSTORE: ${{ runner.temp }}/release.jks
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: >
          ./gradlew :app:check :app:assembleRelease :app:bundleRelease --stacktrace
          -PversionName=${{ steps.version.outputs.name }}
          -PversionCode=${{ steps.version.outputs.code }}

      - name: Name the APK, app bundle and debug symbols after the version
        id: files
        run: |
          apk="seafilesync-${{ steps.version.outputs.name }}.apk"
          aab="seafilesync-${{ steps.version.outputs.name }}.aab"
          symbols="seafilesync-${{ steps.version.outputs.name }}-native-debug-symbols.zip"
          # Play takes the symbols from the bundle; a bundle without them still uploads fine, so
          # check here rather than find out from an unreadable crash.
          if ! unzip -l app/build/outputs/bundle/release/app-release.aab \
              | grep -q 'BUNDLE-METADATA/com.android.tools.build.debugsymbols/'; then
            echo "::error::The app bundle carries no native debug symbols; was the NDK found?"
            exit 1
          fi
          mv app/build/outputs/apk/release/app-release.apk "$apk"
          mv app/build/outputs/bundle/release/app-release.aab "$aab"
          mv app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip "$symbols"
          sha256sum "$apk" > "$apk.sha256"
          sha256sum "$aab" > "$aab.sha256"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "aab=$aab" >> "$GITHUB_OUTPUT"
          echo "symbols=$symbols" >> "$GITHUB_OUTPUT"

      - name: Keep the test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Keep the APK, app bundle and debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: seafilesync-${{ steps.version.outputs.name }}
          path: |
            ${{ steps.files.outputs.apk }}
            ${{ steps.files.outputs.apk }}.sha256
            ${{ steps.files.outputs.aab }}
            ${{ steps.files.outputs.aab }}.sha256
            ${{ steps.files.outputs.symbols }}

      - name: Publish the release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ steps.files.outputs.apk }}
            ${{ steps.files.outputs.apk }}.sha256
            ${{ steps.files.outputs.aab }}
            ${{ steps.files.outputs.aab }}.sha256
            ${{ steps.files.outputs.symbols }}
          generate_release_notes: true
