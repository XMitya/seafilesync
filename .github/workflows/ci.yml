name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the running build pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          # Only main writes the dependency cache; branches and PRs read it.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run the checks and build the debug APK
        # check covers the unit tests, ktlint, Android lint and the Kover coverage gate.
        run: ./gradlew :app:check :app:assembleDebug --stacktrace

      - name: Keep the test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Keep the debug APK
        uses: actions/upload-artifact@v7
        with:
          name: seafilesync-debug
          path: app/build/outputs/apk/debug/app-debug.apk
